<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — دستیار هوشمند</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;background:#0a0a0f;color:#e8e4d9;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:600;letter-spacing:0.08em;color:#c9a96e;margin-bottom:0.3rem;text-align:center}
.subtitle{font-size:0.8rem;letter-spacing:0.2em;color:#5a5a6a;text-transform:uppercase;margin-bottom:2rem;text-align:center}
.api-section{width:100%;max-width:540px;margin-bottom:1.5rem}
.api-label{font-size:0.75rem;color:#5a5a6a;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:0.5rem}
.api-row{display:flex;gap:8px}
.api-input{flex:1;background:#12121a;border:1px solid #2a2a3a;border-radius:8px;padding:0.6rem 1rem;color:#e8e4d9;font-family:'Vazirmatn',sans-serif;font-size:0.85rem;outline:none}
.api-input:focus{border-color:#c9a96e}
.api-btn{background:#c9a96e;color:#0a0a0f;border:none;border-radius:8px;padding:0.6rem 1rem;font-family:'Vazirmatn',sans-serif;font-size:0.8rem;font-weight:500;cursor:pointer;white-space:nowrap}
.chat-box{width:100%;max-width:540px;background:#0e0e16;border:1px solid #1e1e2e;border-radius:16px;height:380px;overflow-y:auto;padding:1.2rem;margin-bottom:1rem;scroll-behavior:smooth}
.msg{margin-bottom:1rem;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-user{text-align:left;direction:ltr}
.msg-user .bubble{display:inline-block;background:#1e1e2e;border-radius:12px 12px 2px 12px;padding:0.6rem 1rem;font-size:0.9rem;color:#b0adc8;max-width:85%}
.msg-jarvis .bubble{display:inline-block;background:#1a1508;border:1px solid #2e2510;border-radius:12px 12px 12px 2px;padding:0.6rem 1rem;font-size:0.9rem;color:#c9a96e;max-width:85%}
.msg-jarvis .name{font-size:0.7rem;color:#5a5040;margin-bottom:4px;letter-spacing:0.1em}
.controls{width:100%;max-width:540px;display:flex;gap:10px;align-items:flex-end}
.text-input{flex:1;background:#12121a;border:1px solid #2a2a3a;border-radius:10px;padding:0.7rem 1rem;color:#e8e4d9;font-family:'Vazirmatn',sans-serif;font-size:0.9rem;outline:none;resize:none;line-height:1.5}
.text-input:focus{border-color:#c9a96e33}
.btn-send{background:#c9a96e;color:#0a0a0f;border:none;border-radius:10px;padding:0.7rem 1.2rem;font-size:0.85rem;font-weight:500;cursor:pointer;font-family:'Vazirmatn',sans-serif;height:42px}
.btn-send:disabled{opacity:0.4;cursor:not-allowed}
.btn-mic{background:#12121a;color:#c9a96e;border:1px solid #2a2a3a;border-radius:10px;padding:0.7rem 1rem;font-size:1.2rem;cursor:pointer;transition:all 0.2s;height:42px}
.btn-mic.recording{background:#3a1a1a;border-color:#c04040;color:#e06060;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
.bottom-row{width:100%;max-width:540px;display:flex;justify-content:space-between;align-items:center;margin-top:0.8rem}
.voice-toggle{display:flex;align-items:center;gap:8px;font-size:0.78rem;color:#4a4a5a}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#1e1e2e;border-radius:20px;transition:0.3s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:#4a4a5a;border-radius:50%;transition:0.3s}
.toggle input:checked+.toggle-slider{background:#2a1f10}
.toggle input:checked+.toggle-slider:before{background:#c9a96e;transform:translateX(16px)}
.status{font-size:0.75rem;color:#3a3a4a;min-height:1rem}
.status.active{color:#6a6a5a}
.clear-btn{font-size:0.75rem;color:#3a3a4a;background:none;border:none;cursor:pointer;font-family:'Vazirmatn',sans-serif}
.clear-btn:hover{color:#c9a96e}
</style>
</head>
<body>

<h1>J A R V I S</h1>
<div class="subtitle">دستیار هوشمند شخصی</div>

<div class="api-section">
  <div class="api-label">Groq API Key</div>
  <div class="api-row">
    <input class="api-input" type="password" id="apiKey" placeholder="gsk_..." />
    <button class="api-btn" onclick="saveKey()">ذخیره</button>
  </div>
</div>

<div class="chat-box" id="chatBox">
  <div class="msg msg-jarvis">
    <div class="name">JARVIS</div>
    <div class="bubble">سلام. آماده‌ام. چه کمکی از دستم برمیاد؟</div>
  </div>
</div>

<div class="controls">
  <button class="btn-mic" id="micBtn" onclick="toggleMic()" title="صحبت کن">🎤</button>
  <textarea class="text-input" id="userInput" placeholder="پیام بنویس یا از میکروفون استفاده کن..." rows="1" onkeydown="handleKey(event)"></textarea>
  <button class="btn-send" id="sendBtn" onclick="sendMessage()">ارسال</button>
</div>

<div class="bottom-row">
  <div class="voice-toggle">
    <label class="toggle">
      <input type="checkbox" id="voiceOut" checked>
      <span class="toggle-slider"></span>
    </label>
    <span>پاسخ صوتی</span>
  </div>
  <div class="status" id="status"></div>
  <button class="clear-btn" onclick="clearChat()">پاک کردن چت</button>
</div>

<script>
let apiKey = localStorage.getItem('jarvis_key') || '';
let isRecording = false;
let recognition = null;
let history = [];

if(apiKey) document.getElementById('apiKey').value = apiKey;

const SYSTEM = `تو Jarvis هستی، یه دستیار هوشمند فارسی‌زبان. شخصیتت رسمی ولی با یه لمس شوخ‌طبعی هوشمندانه‌ست. جواب‌هات کوتاه و مستقیمه. هیچوقت ساختگی نیستی. اگه چیزی نمیدونی صادقانه میگی. به کاربر احترام میذاری ولی چاپلوسی نمیکنی.`;

function saveKey(){
  apiKey = document.getElementById('apiKey').value.trim();
  if(apiKey){
    localStorage.setItem('jarvis_key', apiKey);
    setStatus('✓ کلید ذخیره شد');
    setTimeout(()=>setStatus(''), 2000);
  }
}

function handleKey(e){
  if(e.key==='Enter' && !e.shiftKey){e.preventDefault(); sendMessage();}
}

async function sendMessage(){
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  if(!apiKey){ setStatus('ابتدا API Key وارد کن'); return; }
  input.value = '';
  addMessage(text, 'user');
  await askJarvis(text);
}

function addMessage(text, role){
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg msg-' + (role==='user' ? 'user' : 'jarvis');
  if(role !== 'user') div.innerHTML = `<div class="name">JARVIS</div><div class="bubble">${text}</div>`;
  else div.innerHTML = `<div class="bubble">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

async function askJarvis(userText){
  document.getElementById('sendBtn').disabled = true;
  setStatus('در حال فکر کردن...');
  history.push({role:'user', content:userText});
  try{
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: [{role:'system',content:SYSTEM}, ...history],
        max_tokens: 400,
        temperature: 0.8
      })
    });
    const data = await res.json();
    if(data.error){ setStatus('خطا: ' + data.error.message); history.pop(); return; }
    const reply = data.choices[0].message.content;
    history.push({role:'assistant', content:reply});
    addMessage(reply, 'jarvis');
    if(document.getElementById('voiceOut').checked) speak(reply);
    setStatus('');
  } catch(e){
    setStatus('خطا در اتصال');
    history.pop();
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}

function speak(text){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'fa-IR'; utt.rate = 0.95; utt.pitch = 0.9;
  const voices = speechSynthesis.getVoices();
  const fa = voices.find(v => v.lang.startsWith('fa'));
  if(fa) utt.voice = fa;
  speechSynthesis.speak(utt);
}

function toggleMic(){
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){
    setStatus('مرورگر از میکروفون پشتیبانی نمیکنه — Chrome رو امتحان کن'); return;
  }
  if(isRecording){ stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'fa-IR';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => { isRecording=true; document.getElementById('micBtn').classList.add('recording'); setStatus('در حال گوش دادن...'); }
  recognition.onresult = (e) => { const t=e.results[0][0].transcript; document.getElementById('userInput').value=t; stopMic(); sendMessage(); }
  recognition.onerror = () => { stopMic(); setStatus('خطا در میکروفون'); }
  recognition.onend = () => stopMic();
  recognition.start();
}

function stopMic(){
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  if(recognition) recognition.stop();
  setStatus('');
}

function clearChat(){
  history = [];
  const box = document.getElementById('chatBox');
  box.innerHTML = '<div class="msg msg-jarvis"><div class="name">JARVIS</div><div class="bubble">سلام. آماده‌ام. چه کمکی از دستم برمیاد؟</div></div>';
}

function setStatus(t){
  const s = document.getElementById('status');
  s.textContent = t;
  s.className = 'status' + (t ? ' active' : '');
}

window.speechSynthesis?.addEventListener('voiceschanged', ()=>{});
</script>
</body>
</html>
