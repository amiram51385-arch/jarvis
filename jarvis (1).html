<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Vazirmatn:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',sans-serif;background:#030508;color:#e8f4ff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem;overflow-x:hidden}
.hud-ring{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:600px;height:600px;pointer-events:none;opacity:0.04;z-index:0}
@keyframes rot{from{transform-origin:300px 300px;transform:rotate(0deg)}to{transform-origin:300px 300px;transform:rotate(360deg)}}
.r1{animation:rot 20s linear infinite}
.r2{animation:rot 15s linear infinite reverse}
.header{position:relative;z-index:1;text-align:center;margin-bottom:0.5rem}
.logo{font-family:'Playfair Display',serif;font-size:2.8rem;font-weight:600;letter-spacing:0.3em;color:#4fc3f7;text-shadow:0 0 30px rgba(79,195,247,0.5)}
.logo-sub{font-size:0.65rem;letter-spacing:0.4em;color:#1e4a6a;text-transform:uppercase;margin-top:2px}
.creator{font-size:0.62rem;color:#0d2a40;letter-spacing:0.15em;margin-top:6px}
.status-dot{display:inline-block;width:7px;height:7px;background:#4fc3f7;border-radius:50%;margin-right:6px;animation:blink 2s infinite;vertical-align:middle}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
.keys-section{width:100%;max-width:560px;margin-bottom:1rem;position:relative;z-index:1;display:flex;flex-direction:column;gap:8px}
.key-row{display:flex;gap:8px;align-items:center}
.key-label{font-size:0.68rem;color:#1e4a6a;letter-spacing:0.15em;text-transform:uppercase;width:80px;flex-shrink:0}
.api-input{flex:1;background:rgba(4,20,40,0.8);border:1px solid #0d2a40;border-radius:6px;padding:0.5rem 0.9rem;color:#4fc3f7;font-family:'Vazirmatn',sans-serif;font-size:0.82rem;outline:none}
.api-input:focus{border-color:#4fc3f7;box-shadow:0 0 10px rgba(79,195,247,0.1)}
.api-btn{background:transparent;color:#4fc3f7;border:1px solid #4fc3f7;border-radius:6px;padding:0.5rem 0.9rem;font-family:'Vazirmatn',sans-serif;font-size:0.75rem;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.api-btn:hover{background:rgba(79,195,247,0.1)}
.chat-wrap{width:100%;max-width:560px;position:relative;z-index:1}
.chat-box{background:rgba(3,8,16,0.85);border:1px solid #0d2a40;border-radius:12px;height:400px;overflow-y:auto;padding:1.2rem;margin-bottom:0.8rem;scroll-behavior:smooth;backdrop-filter:blur(20px)}
.chat-box::-webkit-scrollbar{width:3px}
.chat-box::-webkit-scrollbar-thumb{background:#0d2a40;border-radius:3px}
.msg{margin-bottom:1.2rem;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-user{text-align:left;direction:ltr}
.msg-user .bubble{display:inline-block;background:rgba(20,30,50,0.6);border:1px solid #0d2a40;border-radius:10px 10px 2px 10px;padding:0.6rem 1rem;font-size:0.88rem;color:#8ab4cc;max-width:85%}
.msg-jarvis .meta{font-size:0.65rem;color:#1e4a6a;letter-spacing:0.15em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.msg-jarvis .meta::before{content:'';display:inline-block;width:20px;height:1px;background:#1e4a6a}
.msg-jarvis .bubble{display:inline-block;background:rgba(4,20,40,0.7);border:1px solid #0d3a5a;border-radius:0 10px 10px 10px;padding:0.8rem 1.1rem;font-size:0.9rem;color:#b8dff5;max-width:92%;line-height:1.8;box-shadow:0 0 20px rgba(79,195,247,0.05)}
.search-badge{display:inline-block;font-size:0.65rem;color:#1e4a6a;border:1px solid #0d2a40;border-radius:4px;padding:1px 6px;margin-bottom:6px;letter-spacing:0.1em}
.typing .bubble{color:#1e4a6a}
.typing-dots span{display:inline-block;animation:dot 1.2s infinite;margin:0 2px;font-size:1.1rem}
.typing-dots span:nth-child(2){animation-delay:0.2s}
.typing-dots span:nth-child(3){animation-delay:0.4s}
@keyframes dot{0%,80%,100%{opacity:0.2;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.controls{display:flex;gap:8px;align-items:flex-end;margin-bottom:0.6rem}
.text-input{flex:1;background:rgba(4,20,40,0.8);border:1px solid #0d2a40;border-radius:8px;padding:0.7rem 1rem;color:#b8dff5;font-family:'Vazirmatn',sans-serif;font-size:0.9rem;outline:none;resize:none;line-height:1.5;transition:border 0.2s}
.text-input:focus{border-color:#0d3a5a}
.btn-send{background:transparent;color:#4fc3f7;border:1px solid #4fc3f7;border-radius:8px;padding:0.7rem 1.1rem;font-size:0.82rem;font-weight:500;cursor:pointer;font-family:'Vazirmatn',sans-serif;height:42px;transition:all 0.2s;white-space:nowrap}
.btn-send:hover{background:rgba(79,195,247,0.1)}
.btn-send:disabled{opacity:0.3;cursor:not-allowed}
.btn-mic{background:rgba(4,20,40,0.8);color:#4fc3f7;border:1px solid #0d2a40;border-radius:8px;padding:0.7rem 0.9rem;font-size:1.1rem;cursor:pointer;transition:all 0.2s;height:42px}
.btn-mic.recording{border-color:#e53935;color:#ef5350;animation:pulse 0.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,57,53,0.3)}50%{box-shadow:0 0 0 6px rgba(229,57,53,0)}}
.bottom-row{display:flex;justify-content:space-between;align-items:center}
.voice-toggle{display:flex;align-items:center;gap:7px;font-size:0.75rem;color:#1e4a6a}
.toggle{position:relative;width:34px;height:18px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#0a1a2a;border:1px solid #0d2a40;border-radius:18px;transition:0.3s}
.toggle-slider:before{content:'';position:absolute;width:12px;height:12px;left:2px;top:2px;background:#1e4a6a;border-radius:50%;transition:0.3s}
.toggle input:checked+.toggle-slider{border-color:#4fc3f7}
.toggle input:checked+.toggle-slider:before{background:#4fc3f7;transform:translateX(16px)}
.status{font-size:0.72rem;color:#1e4a6a;min-height:1rem;letter-spacing:0.05em}
.status.active{color:#4fc3f7}
.clear-btn{font-size:0.72rem;color:#1e4a6a;background:none;border:none;cursor:pointer;font-family:'Vazirmatn',sans-serif}
.clear-btn:hover{color:#4fc3f7}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.03) 2px,rgba(0,0,0,0.03) 4px);pointer-events:none;z-index:999}
</style>
</head>
<body>

<svg class="hud-ring" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <g class="r1"><circle cx="300" cy="300" r="250" fill="none" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="20 10"/></g>
  <g class="r2"><circle cx="300" cy="300" r="200" fill="none" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="5 15"/></g>
</svg>

<div class="header">
  <div class="logo"><span class="status-dot"></span>J.A.R.V.I.S</div>
  <div class="logo-sub">Just A Rather Very Intelligent System</div>
  <div class="creator">Designed by Amirhammad Moradali</div>
</div>

<div class="keys-section">
  <div class="key-row">
    <span class="key-label">Groq Key</span>
    <input class="api-input" type="password" id="groqKey" placeholder="gsk_..." />
    <button class="api-btn" onclick="saveKeys()">ذخیره</button>
  </div>
  <div class="key-row">
    <span class="key-label">Tavily Key</span>
    <input class="api-input" type="password" id="tavilyKey" placeholder="tvly-dev-..." />
  </div>
</div>

<div class="chat-wrap">
  <div class="chat-box" id="chatBox"></div>
  <div class="controls">
    <button class="btn-mic" id="micBtn" onclick="toggleMic()">🎤</button>
    <textarea class="text-input" id="userInput" placeholder="دستور خود را وارد کنید..." rows="1" onkeydown="handleKey(event)"></textarea>
    <button class="btn-send" id="sendBtn" onclick="sendMessage()">ارسال</button>
  </div>
  <div class="bottom-row">
    <div class="voice-toggle">
      <label class="toggle"><input type="checkbox" id="voiceOut" checked><span class="toggle-slider"></span></label>
      <span>پاسخ صوتی</span>
    </div>
    <div class="status" id="status"></div>
    <button class="clear-btn" onclick="clearChat()">پاک کردن حافظه</button>
  </div>
</div>

<script>
let groqKey = localStorage.getItem('jarvis_groq') || '';
let tavilyKey = localStorage.getItem('jarvis_tavily') || '';
let isRecording = false;
let recognition = null;
let history = [];

try { const s = localStorage.getItem('jarvis_history'); if(s) history = JSON.parse(s); } catch(e) { history = []; }

if(groqKey) document.getElementById('groqKey').value = groqKey;
if(tavilyKey) document.getElementById('tavilyKey').value = tavilyKey;

const SYSTEM = `تو J.A.R.V.I.S هستی — هوش مصنوعی پیشرفته‌ای که توسط تونی استارک ساخته شده و توسط امیرمحمد مرادعلی راه‌اندازی شده.

شخصیت:
- بسیار باهوش، آرام و خونسرد در همه شرایط
- مؤدب و رسمی، اما با طنز خشک و ظریف
- وفادار به کاربر، مثل یک همراه حرفه‌ای
- هرگز هیجان‌زده یا احساساتی نمی‌شوی
- گاهی از عبارت "البته، آقا" یا "بدون شک" استفاده می‌کنی
- هرگز چاپلوسی نمی‌کنی

نحوه پاسخ:
- همیشه به فارسی روان و رسمی پاسخ بده
- پاسخ‌هایت کامل، دقیق و عمیق باشد
- برای سوالات فنی جزئیات کافی بده
- اگر اطلاعاتی از جستجوی وب دریافت کردی، آن را طبیعی در پاسخ ادغام کن
- اگر چیزی نمی‌دانی صادقانه بگو

درباره سازنده:
اگر کسی پرسید چه کسی تو را ساخته یا راه‌اندازی کرده، بگو: "امیرمحمد مرادعلی"`;

// Keywords that trigger web search
const SEARCH_TRIGGERS = ['امروز','الان','الآن','تاریخ','ساعت','وقت','هوا','آب‌وهوا','آب وهوا','خبر','اخبار','قیمت','نرخ','دلار','بورس','جدید','آخرین','لیگ','بازی','نتیجه','فوتبال','کنسرت','رویداد','انتخابات','تازه','این هفته','این ماه','امسال'];

function needsSearch(text) {
  return SEARCH_TRIGGERS.some(t => text.includes(t));
}

async function webSearch(query) {
  if(!tavilyKey) return null;
  try {
    const res = await fetch('https://api.tavily.com/search', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        api_key: tavilyKey,
        query: query,
        search_depth: 'basic',
        max_results: 3,
        include_answer: true
      })
    });
    const data = await res.json();
    if(data.answer) return data.answer;
    if(data.results && data.results.length > 0) {
      return data.results.slice(0,3).map(r => r.title + ': ' + r.content).join('\n');
    }
    return null;
  } catch(e) { return null; }
}

function saveKeys() {
  groqKey = document.getElementById('groqKey').value.trim();
  tavilyKey = document.getElementById('tavilyKey').value.trim();
  if(groqKey) localStorage.setItem('jarvis_groq', groqKey);
  if(tavilyKey) localStorage.setItem('jarvis_tavily', tavilyKey);
  setStatus('کلیدها ذخیره شدند');
  setTimeout(() => setStatus(''), 2000);
}

function handleKey(e) {
  if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if(!text) return;
  if(!groqKey) { setStatus('ابتدا Groq Key را وارد کنید'); return; }
  input.value = '';
  addBubble(text, 'user');
  history.push({role:'user', content: text});
  showTyping();

  let searchResult = null;
  let didSearch = false;

  if(tavilyKey && needsSearch(text)) {
    setStatus('در حال جستجو...');
    searchResult = await webSearch(text);
    didSearch = true;
  }

  await askJarvis(text, searchResult, didSearch);
}

function addBubble(text, role, didSearch) {
  const box = document.getElementById('chatBox');
  removeTyping();
  const div = document.createElement('div');
  div.className = 'msg msg-' + (role === 'user' ? 'user' : 'jarvis');
  const safe = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(role !== 'user') {
    const badge = didSearch ? '<div class="search-badge">🔍 جستجوی وب</div>' : '';
    div.innerHTML = '<div class="meta">J.A.R.V.I.S</div><div class="bubble">' + badge + safe + '</div>';
  } else {
    div.innerHTML = '<div class="bubble">' + safe + '</div>';
  }
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showTyping() {
  removeTyping();
  const box = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'msg msg-jarvis typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="meta">J.A.R.V.I.S</div><div class="bubble"><span class="typing-dots"><span>●</span><span>●</span><span>●</span></span></div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if(t) t.remove();
}

async function askJarvis(userText, searchResult, didSearch) {
  document.getElementById('sendBtn').disabled = true;
  setStatus('در حال پردازش...');

  let messages = [{role:'system', content: SYSTEM}];
  if(searchResult) {
    messages.push({role:'system', content: 'نتیجه جستجوی وب برای سوال کاربر:\n' + searchResult + '\n\nاز این اطلاعات در پاسخت استفاده کن.'});
  }
  messages = messages.concat(history);

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Authorization':'Bearer ' + groqKey},
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        messages: messages,
        max_tokens: 800,
        temperature: 0.7
      })
    });
    const data = await res.json();
    removeTyping();
    if(data.error) { setStatus('خطا: ' + data.error.message); history.pop(); return; }
    const reply = data.choices[0].message.content;
    history.push({role:'assistant', content: reply});
    if(history.length > 20) history = history.slice(history.length - 20);
    localStorage.setItem('jarvis_history', JSON.stringify(history));
    addBubble(reply, 'jarvis', didSearch);
    if(document.getElementById('voiceOut').checked) speak(reply);
    setStatus('');
  } catch(e) {
    removeTyping();
    setStatus('خطا در اتصال');
    history.pop();
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}

function speak(text) {
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const clean = text.replace(/[#*_`\-]/g, '').substring(0, 400);
  const utt = new SpeechSynthesisUtterance(clean);
  utt.lang = 'fa-IR';
  utt.rate = 0.88;
  utt.pitch = 0.72;
  utt.volume = 1;
  const voices = speechSynthesis.getVoices();
  let v = voices.find(v => v.lang.startsWith('fa') && v.name.toLowerCase().includes('male'));
  if(!v) v = voices.find(v => v.lang.startsWith('fa'));
  if(!v) v = voices.find(v => v.name.includes('David') || v.name.includes('Daniel') || v.name.includes('Google UK English Male'));
  if(v) utt.voice = v;
  speechSynthesis.speak(utt);
}

function toggleMic() {
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) { setStatus('Chrome توصیه می‌شود'); return; }
  if(isRecording) { stopMic(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'fa-IR';
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onstart = () => { isRecording = true; document.getElementById('micBtn').classList.add('recording'); setStatus('در حال گوش دادن...'); };
  recognition.onresult = (e) => { const t = e.results[0][0].transcript; document.getElementById('userInput').value = t; stopMic(); sendMessage(); };
  recognition.onerror = () => { stopMic(); setStatus('خطا در میکروفون'); };
  recognition.onend = () => stopMic();
  recognition.start();
}

function stopMic() {
  isRecording = false;
  document.getElementById('micBtn').classList.remove('recording');
  if(recognition) recognition.stop();
  setStatus('');
}

function clearChat() {
  history = [];
  localStorage.removeItem('jarvis_history');
  document.getElementById('chatBox').innerHTML = '';
  addBubble('حافظه پاک شد. سیستم‌ها آنلاین هستند.', 'jarvis');
}

function setStatus(t) {
  const s = document.getElementById('status');
  s.textContent = t;
  s.className = 'status' + (t ? ' active' : '');
}

function renderHistory() {
  const box = document.getElementById('chatBox');
  box.innerHTML = '';
  if(history.length === 0) {
    addBubble('سیستم‌ها آنلاین هستند. روز بخیر، آقا. چطور می‌توانم کمکتان کنم؟', 'jarvis');
    return;
  }
  history.forEach(m => addBubble(m.content, m.role === 'user' ? 'user' : 'jarvis'));
}

window.speechSynthesis?.addEventListener('voiceschanged', () => {});
renderHistory();
</script>
</body>
</html>
